<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">
    <div class="row" id="page-row">
        <div class="card col me-3 border-0 shadow-lg" id="control-card">
            <div class="card-header mt-3 border-0 bg-transparent">
                <h5>Student Control Panel</h5>
            </div>
            <div class="card-body">
                <div class="card mb-3 border-3">
                    <div class="card-body">
                        <input class="form-control mb-3 border-3" type="text" placeholder="Bir id giriniz">
                        <button class="btn btn-primary w-100">Getir</button>                      
                    </div>
                </div>
                <div class="card mb-3 border-3">
                    <div class="card-body">
                        <input class="form-control mb-3 border-3" type="text" placeholder="Bir e-mail giriniz">
                        <button class="btn btn-primary w-100">Getir</button>                      
                    </div>
                </div>
                <div class="card mb-3 border-3">
                    <div class="card-body">
                        <button class="btn btn-primary w-100" (click)="loadStudents()">Tüm öğrencileri listele</button>
                    </div>
                </div>
                <div class="card border-3">
                    <div class="card-body">
                        <button class="btn btn-primary w-100 " (click)="loadActiveStudents()">Aktif öğrencileri listele</button>
                    </div>
                </div>
            </div>
            <div class="card-footer text-center border-0 bg-transparent">
                <button class="btn btn-warning w-50 mb-3">Cıkış</button>
            </div>
        </div>
        <div class="card col border-0 shadow-lg" id="view-card">
            <div class="card-header mt-3 border-0 bg-transparent">
                <h5>View Panel</h5>
            </div>
            <div class="card-body">
                <div class="card border-3 accordion ghost-scroll" id="list-card"> 
                    @if (students()) {
                        @for (item of students(); track $index) {
                            <div class="accordion ms-3 mt-3 me-3">
                                <div class="accordion-item">
                                    <div class="accordion-header">
                                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" [attr.data-bs-target]="'#colapse'+ item.schoolNumber" aria-expanded="true" [aria-controls]="'colapse'+ item.schoolNumber">
                                            <span class="status-indicator me-3 ms-0" [ngClass]="item.isActive ? 'bg-success': 'bg-danger'"></span>
                                            <h5 class="mb-0">{{item.fullName}}</h5>
                                            <small class="text-secondary opacity-75 ms-5">Age: {{item.age}}</small>
                                            <small class="text-secondary opacity-75 ms-5">No: {{item.schoolNumber}}</small>
                                        </button>
                                    </div>
                                </div>
                                <div [id]="'colapse'+ item.schoolNumber" class="accordion-collapse collapse" data-bs-parent="#student-info">
                                    <div class="accordion-body row">
                                        <input class="form-control col me-1" type="text" placeholder="Name">
                                        <input class="form-control col me-1" type="text" placeholder="Surname">
                                        <input class="form-control col me-1" type="number" placeholder="21">
                                        <button class="btn btn-warning col" [ngClass]="{'disabled': item.isActive === false}">Update</button>
                                    </div>
                                </div>
                            </div>
                        }
                    }
                    @if (activeStudents()) {
                        @for (item of activeStudents(); track $index) {
                            <div class="accordion ms-3 mt-3 me-3">
                                <div class="accordion-item">
                                    <div class="accordion-header">
                                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" [attr.data-bs-target]="'#colapse'+ item.schoolNumber" aria-expanded="true" [aria-controls]="'colapse'+ item.schoolNumber">
                                            <span class="status-indicator me-3 ms-0 bg-success"></span>
                                            <h5 class="mb-0">{{item.fullName}}</h5>
                                            <small class="text-secondary opacity-75 ms-5">Age: {{item.age}}</small>
                                            <small class="text-secondary opacity-75 ms-5">No: {{item.schoolNumber}}</small>
                                        </button>
                                    </div>
                                </div>
                                <div [id]="'colapse'+ item.schoolNumber" class="accordion-collapse collapse" data-bs-parent="#student-info">
                                    <div class="accordion-body row">
                                        <input class="form-control col me-1" type="text" placeholder="Name">
                                        <input class="form-control col me-1" type="text" placeholder="Surname">
                                        <input class="form-control col me-1" type="number" placeholder="21">
                                        <button class="btn btn-warning col">Update</button>
                                    </div>
                                </div>
                            </div>
                        }
                    }
                    @if (student()) {
                        <div class="accordion ms-3 mt-3 me-3">
                            <div class="accordion-item">
                                <div class="accordion-header">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" [attr.data-bs-target]="'#colapse'+ student()?.schoolNumber" aria-expanded="true" [aria-controls]="'colapse'+ student()?.schoolNumber">
                                        <span class="status-indicator me-3 ms-0" [ngClass]="student()?.isActive ? 'bg-success' :'bg-danger'"></span>
                                        <h5 class="mb-0">{{student()?.fullName}}</h5>
                                        <small class="text-secondary opacity-75 ms-5">Age: {{student()?.age}}</small>
                                        <small class="text-secondary opacity-75 ms-5">No: {{student()?.schoolNumber}}</small>
                                    </button>
                                </div>
                            </div>
                            <div [id]="'colapse'+ student()?.schoolNumber" class="accordion-collapse collapse" data-bs-parent="#student-info">
                                <div class="accordion-body row">
                                    <input class="form-control col me-1" type="text" placeholder="Name">
                                    <input class="form-control col me-1" type="text" placeholder="Surname">
                                    <input class="form-control col me-1" type="number" placeholder="21">
                                    <button class="btn btn-warning col" [ngClass]="{'disabled': student()?.isActive == false}">Update</button>
                                </div>
                            </div>
                        </div>
                    }
                </div> 
            </div>
        </div>
    </div>
</div>
