<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">
    <div class="card shadow-lg">
        <div class="Card-header text-center">
            <div class="nav nav-tabs">
                <button class="btn nav-link w-50" [ngClass]="{'active': activeRole === 'student'}" (click)="setRole('student')">Student</button>
                <button class="btn nav-link w-50" [ngClass]="{'active': activeRole === 'teacher'}" (click)="setRole('teacher')" (click)="getBranches()">Teacher</button>
            </div>
        </div>
        <div class="card-body" [formGroup]="formBody">
            <div class="form-floating mb-3">
                <input class="form-control" type="text" id="firstName" formControlName="firstName">
                <label for="firstName">First Name</label>
            </div>
            <div class="form-floating mb-3">
                <input class="form-control" type="text" id="lastName" formControlName="lastName">
                <label for="lastName">Last Name</label>
            </div>
            <div class="form-floating mb-3">
                <input class="form-control" type="text" id="lastName" formControlName="email">
                <label for="email">Email</label>
            </div>
            <div class="form-floating mb-3">
                <input class="form-control" type="password" id="password" formControlName="email">
                <label for="password">Password</label>
            </div>
            @if (activeRole === 'teacher') {
                <select class="form-select w-50">
                <option selected>Select Branch</option>
                @for (item of branches; track $index) {
                    <option value="{{item.id}}">{{item.name}}</option>
                }
                </select>
            }            
        </div>
        <div class="card-footer">
            <button class="btn btn-primary w-100">Singup</button>
        </div>
    </div>
</div>
